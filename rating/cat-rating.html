<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katzen-Bewertung</title>
<style>
  :root {
    --cat-size: 52px;
    --cat-gap: 8px;
    --bg: #fdfbf7;
    --fg: #2c2620;
    --muted: #8a8178;
    --accent: #e8a33d;
    --card: #fff;
    --border: #e7e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1714; --fg: #f0eae2; --muted: #9c9288;
      --card: #24201c; --border: #3a342e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1714; --fg: #f0eae2; --muted: #9c9288;
    --card: #24201c; --border: #3a342e;
  }

  body {
    margin: 0; padding: 40px 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; width: 100%; max-width: 440px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  /* ---- Die Komponente ---- */
  .cat-rating {
    display: inline-flex; gap: var(--cat-gap);
    background: none; border: 0; padding: 0; margin: 0;
  }
  .cat-rating__btn {
    width: var(--cat-size); height: var(--cat-size);
    padding: 0; border: 0; background: none;
    border-radius: 50%; cursor: pointer;
    transition: transform .18s ease;
    /* leer = ausgegraut */
    filter: grayscale(1) opacity(.35);
  }
  .cat-rating__btn img {
    width: 100%; height: 100%; display: block;
    border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 2px var(--border);
  }
  /* gefüllt: bis zum aktuellen Wert (Hover oder Auswahl) */
  .cat-rating__btn.is-on {
    filter: none;
    transform: scale(1.08) rotate(-4deg);
  }
  .cat-rating__btn.is-on img { box-shadow: 0 0 0 2px var(--accent); }
  .cat-rating__btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .cat-rating__btn { transition: none; }
    .cat-rating__btn.is-on { transform: none; }
  }

  .cat-rating__label {
    margin-top: 12px; font-size: 15px; color: var(--muted); min-height: 1.5em;
  }
  .cat-rating__label b { color: var(--fg); }
</style>
</head>
<body>

<div class="card">
  <h1>Wie war die Lektion?</h1>
  <p class="hint">Klicke auf eine Katze (1–5). Pfeiltasten funktionieren auch.</p>

  <div class="cat-rating" role="radiogroup" aria-label="Bewertung von 1 bis 5"
       data-cat-rating data-value="0"></div>
  <div class="cat-rating__label" data-cat-rating-label></div>
</div>

<script>
const CAT_LABELS = ["", "Miserabel", "Geht so", "Ganz okay", "Richtig gut", "Perfekt!"];
const CAT_SRC = "cat-rating.jpg";

function initCatRating(root) {
  const max = Number(root.dataset.max || 5);
  const labelEl = root.parentElement.querySelector("[data-cat-rating-label]");
  let value = Number(root.dataset.value || 0);

  // Buttons erzeugen
  for (let i = 1; i <= max; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat-rating__btn";
    b.dataset.score = i;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-label", i + " von " + max + " – " + CAT_LABELS[i]);
    b.innerHTML = '<img src="' + CAT_SRC + '" alt="">';
    root.appendChild(b);
  }
  const btns = [...root.querySelectorAll(".cat-rating__btn")];

  function paint(n, preview) {
    btns.forEach((b, i) => b.classList.toggle("is-on", i < n));
    btns.forEach((b, i) => {
      b.setAttribute("aria-checked", String(i + 1 === value));
      b.tabIndex = (value ? i + 1 === value : i === 0) ? 0 : -1;
    });
    root.dataset.value = value;
    if (labelEl) {
      labelEl.innerHTML = n
        ? "<b>" + n + "/" + max + "</b> – " + CAT_LABELS[n] + (preview ? "" : " ✓")
        : "Noch nicht bewertet";
    }
  }

  function set(n) {
    value = n;
    paint(value, false);
    root.dispatchEvent(new CustomEvent("cat-rating:change", {
      detail: { value: n }, bubbles: true
    }));
  }

  btns.forEach((b, i) => {
    b.addEventListener("mouseenter", () => paint(i + 1, true));
    b.addEventListener("focus", () => paint(i + 1, true));
    b.addEventListener("click", () => set(i + 1));
  });
  root.addEventListener("mouseleave", () => paint(value, false));
  root.addEventListener("keydown", (e) => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (!d) return;
    e.preventDefault();
    const next = Math.min(max, Math.max(1, (value || 0) + d));
    set(next);
    btns[next - 1].focus();
  });

  paint(value, false);
  return { get value() { return value; }, set };
}

document.querySelectorAll("[data-cat-rating]").forEach(initCatRating);

// Beispiel: auf Änderungen reagieren
document.addEventListener("cat-rating:change", e => {
  console.log("Bewertung:", e.detail.value);
});
</script>
</body>
</html>
